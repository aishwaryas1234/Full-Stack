<!DOCTYPE html>
<html>
    <head>
        <title>Cardsdemo</title>
        <style>
            .card{
                border: 1px solid #ccc;
                border-radius: 5px;
                padding: 20px;
                margin-bottom: 20px;
                box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
                color: blueviolet;
                width: 300px;
            }
            .card h2{
                margin-top: 0;
            }
        </style>
    </head>
    <body>
        <h1>Cards Sample</h1>
        <div class="card">
            <h2>Card Title 1</h2>
            <p>This is a sample card content.</p>
        </div>
        <div class="card">
            <h2>Card Title 2</h2>
            <p>This is a sample card content.</p>
        </div>
    </body>
</html>
