<!DOCTYPE html>
<html>
    <head>
        <title>MultiMediaDemo</title>
    </head>
    <body>
        <h1>My Image</h1>
        <img src="images.jpeg" alt="Image not found" height="400" width="100%">
        <h1>My Audio</h1>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does mot support this element.
        </audio>
        <h1>My Video</h1>
        <video controls width="300" height="300">
            <source src="video.mp4">
            Your browser does mot support this element.
        </video>
        <h1>My YouTube Videos:</h1>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/HcOc7P5BMi4?si=kB8sUlHu2Eh8STJS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>"
    </body>
</html>
